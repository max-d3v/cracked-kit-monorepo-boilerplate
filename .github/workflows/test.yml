name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Don't install git hooks on the runner (`prepare` runs `lefthook install`).
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Uses the version pinned in package.json's "packageManager" field.
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Vitest adds the GitHub Actions reporter automatically, so failures
      # show up as annotations on the PR diff.
      - name: Run unit tests
        run: bun run test:run
