# EXAMPLE USAGE:
#
#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/
#
# No full `bun run build` on pre-push: it is slow, needs every app's local
# .env secrets, and CI/Vercel already build each PR.
# pre-push:
#   jobs:
#     - name: packages audit
#       tags:
#         - frontend
#         - security
#       run: bun audit

pre-commit:
  jobs:
    - name: type check
      run: bun run typecheck
      stage_fixed: true

    - name: ultracite fix
      run: bun run check
      stage_fixed: true
